<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camille & Foukou Mariage</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- MOBILE BACKGROUND IMAGES (must be INSIDE <body>, not above <html>) -->
<div class="bg1"></div>
<div class="bg2"></div>

<div class="container">

  <h1>Camille & Foukou Mariage</h1>
  <h2>Partagez vos souvenirs</h2>

  <p class="description">
    Merci de partager vos photos et vidéos de notre quête photo du mariage
    <strong>“Capturez Le Moment”</strong>.
  </p>

  <form id="uploadForm">

    <input type="text" id="name" name="name" placeholder="Nom complet" required />

    <div class="button-group">
      <label class="btn upload-btn">
        📁 Télécharger photos / vidéos
        <input type="file" id="files" name="files" accept="image/*,video/*" multiple hidden>
      </label>

      <label class="btn camera-btn">
        📸 Prendre une photo / vidéo
        <input type="file" id="camera" name="files" accept="image/*,video/*" capture="environment" multiple hidden>
      </label>
    </div>

    <p id="fileCount" class="file-count">Aucun fichier sélectionné</p>

    <progress id="progressBar" value="0" max="100"></progress>

    <button type="submit" class="submit-btn">Envoyer</button>
  </form>

  <div id="thankyou" class="hidden">
    <h2>Merci beaucoup !</h2>
    <p>Vos photos et vidéos ont été envoyées avec succès.</p>
  </div>

</div>

<script src="script.js"></script>

<!-- SCROLL UNBLUR SCRIPT -->
<script>
document.addEventListener("scroll", () => {
  const scrollY = window.scrollY;

  // FIRST IMAGE unblurs as you scroll
  const blur1 = Math.max(4 - scrollY / 40, 0);
  document.querySelector(".bg1").style.filter = `blur(${blur1}px)`;

  // SECOND IMAGE unblurs when you reach it
  const blur2 = Math.max(4 - (scrollY - window.innerHeight) / 40, 0);
  document.querySelector(".bg2").style.filter = `blur(${blur2}px)`;
});
</script>

</body>
</html>
